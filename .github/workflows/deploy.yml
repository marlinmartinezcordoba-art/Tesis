name: Probar y desplegar en el Droplet

# Cada cambio en esta rama primero pasa las pruebas automáticas; solo si
# pasan se despliega en el servidor.
#
# Secretos (Settings → Secrets and variables → Actions):
#   DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY   acceso al servidor
#   RICORA_ADMIN_CORREO     correo de la cuenta administradora (con él se ingresa)
#   RICORA_ADMIN_PASSWORD   su contraseña (se restablece en cada despliegue)
#   RICORA_ADMIN_NOMBRE     nombre que se muestra (opcional)
#   RICORA_ADMIN_USER       usuario de la versión anterior; solo se usa si no
#                           hay RICORA_ADMIN_CORREO (ingresa como <usuario>@ricora.local)
#   EMAIL_HOST_USER         correo desde el que salen invitaciones y recuperaciones
#   EMAIL_HOST_PASSWORD     su contraseña de aplicación (Gmail: 16 letras)
#   EMAIL_HOST              servidor SMTP (por defecto smtp.gmail.com)
#   RICORA_DOMINIO          nombre propio para HTTPS (opcional)
#   GEMINI_API_KEY          clave de Google AI Studio para el motor de análisis
#                           de la descripción (sin ella, se describe a mano)
on:
  push:
    branches: [claude/plataforma-base]
  workflow_dispatch: {}

# Un despliegue a la vez: dos seguidos chocaban al recrear los contenedores
# («the container name is already in use»). El nuevo espera al que está en
# curso; no lo cancela, para no dejar el servidor a medio actualizar.
concurrency:
  group: despliegue-droplet
  cancel-in-progress: false

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ricora
          POSTGRES_PASSWORD: ricora
          POSTGRES_DB: ricora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ricora" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - name: Herramientas de ingesta y preservación (Siegfried/PRONOM, Tesseract en español, Ghostscript)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa ghostscript
          CGO_ENABLED=0 go install github.com/richardlehane/siegfried/cmd/sf@v1.11.9
          echo "RICORA_SIEGFRIED=$(go env GOPATH)/bin/sf" >> "$GITHUB_ENV"
          echo "RICORA_SIEGFRIED_HOME=$(go env GOMODCACHE)/github.com/richardlehane/siegfried@v1.11.9/cmd/roy/data" >> "$GITHUB_ENV"
      - name: Pruebas del backend
        env:
          DATABASE_URL: postgresql+psycopg2://ricora:ricora@localhost:5432/ricora_pruebas
          RICORA_PREMIS_MUESTRA: ${{ runner.temp }}/premis-muestra.xml
        run: |
          pip install -r requirements.txt pytest httpx bagit==1.8.1
          python -m pytest -q tests
      - name: PREMIS contra el esquema oficial de la Library of Congress
        run: |
          pip install xmlschema==3.4.3
          python scripts/validar_premis.py "${{ runner.temp }}/premis-muestra.xml" documentacion/anexos/aip-ejemplo/*/data/metadatos/premis.xml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilación y tipos de la interfaz
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  desplegar:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y reconstruir en el Droplet
        uses: appleboy/ssh-action@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RICORA_ADMIN_CORREO: ${{ secrets.RICORA_ADMIN_CORREO }}
          RICORA_ADMIN_USER: ${{ secrets.RICORA_ADMIN_USER }}
          RICORA_ADMIN_PASSWORD: ${{ secrets.RICORA_ADMIN_PASSWORD }}
          RICORA_ADMIN_NOMBRE: ${{ secrets.RICORA_ADMIN_NOMBRE }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          RICORA_DOMINIO: ${{ secrets.RICORA_DOMINIO }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GEMINI_API_KEY,RICORA_ADMIN_CORREO,RICORA_ADMIN_USER,RICORA_ADMIN_PASSWORD,RICORA_ADMIN_NOMBRE,DROPLET_HOST,RICORA_DOMINIO,EMAIL_HOST,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD
          command_timeout: 25m
          script: |
            set -e
            cd /root/ricora
            # El despliegue lo hace solo este flujo, después de las pruebas: se
            # retira la revisión automática cada 5 minutos de la versión anterior.
            if crontab -l 2>/dev/null | grep -q actualizar.sh; then
              crontab -l | grep -v actualizar.sh | crontab - && echo "  revisión automática por cron retirada"
            fi
            git fetch origin claude/plataforma-base
            git reset --hard origin/claude/plataforma-base

            # Memoria de reserva (swap) de 2 GB; se crea una sola vez.
            if ! swapon --show | grep -q "/swapfile"; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile || echo "  aviso: no se pudo crear /swapfile"
              fi
              swapon /swapfile || echo "  aviso: no se pudo activar el swap"
              grep -q "^/swapfile " /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab
            fi

            touch .env
            poner() {  # poner CLAVE VALOR: reemplaza o agrega CLAVE=VALOR sin mostrar el valor
              if [ -n "$2" ]; then
                if grep -qxF "$1=$2" .env; then return; fi
                grep -v "^$1=" .env > .env.tmp || true
                mv .env.tmp .env
                echo "$1=$2" >> .env
                echo "  .env: $1 actualizado"
              fi
            }
            quitar() { grep -v "^$1=" .env > .env.tmp || true; mv .env.tmp .env; }
            valor() { grep "^$1=" .env | tail -1 | cut -d= -f2-; }

            # Clave de sesiones y de base de datos: se generan una sola vez.
            [ -n "$(valor RICORA_SECRET_KEY)" ] || poner RICORA_SECRET_KEY "$(openssl rand -hex 32)"
            [ -n "$(valor POSTGRES_PASSWORD)" ] || poner POSTGRES_PASSWORD "$(openssl rand -hex 16)"
            # Puerto: se conserva el que ya usaba el servidor.
            [ -n "$(valor RICORA_PUERTO)" ] || poner RICORA_PUERTO "$(grep -E '^[A-Z]+_PUERTO=' .env | head -1 | cut -d= -f2-)"
            [ -n "$(valor RICORA_PUERTO)" ] || poner RICORA_PUERTO 80

            poner GEMINI_API_KEY "$GEMINI_API_KEY"
            poner RICORA_ADMIN_CORREO "$RICORA_ADMIN_CORREO"
            poner RICORA_ADMIN_USER "$RICORA_ADMIN_USER"
            poner RICORA_ADMIN_PASSWORD "$RICORA_ADMIN_PASSWORD"
            poner RICORA_ADMIN_NOMBRE "$RICORA_ADMIN_NOMBRE"
            if [ -n "$EMAIL_HOST_USER" ] && [ -z "$EMAIL_HOST" ]; then EMAIL_HOST=smtp.gmail.com; fi
            poner EMAIL_HOST "$EMAIL_HOST"
            poner EMAIL_HOST_USER "$EMAIL_HOST_USER"
            poner EMAIL_HOST_PASSWORD "$EMAIL_HOST_PASSWORD"

            # HTTPS con nombre propio: solo si el nombre ya apunta a este servidor.
            https=0
            if [ -n "$RICORA_DOMINIO" ]; then
              resuelve=$(getent ahostsv4 "$RICORA_DOMINIO" | awk 'NR==1{print $1}')
              if [ "$resuelve" = "$DROPLET_HOST" ]; then https=1; else
                echo "  aviso: $RICORA_DOMINIO apunta a ${resuelve:-ninguna dirección}, no a este servidor; se sigue sin HTTPS."
              fi
            fi
            if [ "$https" = 1 ]; then
              poner RICORA_DOMINIO "$RICORA_DOMINIO"
              poner COMPOSE_PROFILES https
              poner RICORA_PUERTO 8081
              poner RICORA_WEB_BIND 127.0.0.1
              poner RICORA_DETRAS_DE_PROXY 1
              poner RICORA_GALLETA_SEGURA 1
              poner RICORA_URL_PUBLICA "https://$RICORA_DOMINIO"
            else
              if grep -q "^COMPOSE_PROFILES=https" .env; then
                docker compose --profile https rm -sf caddy || true
                quitar COMPOSE_PROFILES
                poner RICORA_PUERTO 80
              fi
              quitar RICORA_DOMINIO
              poner RICORA_WEB_BIND 0.0.0.0
              poner RICORA_DETRAS_DE_PROXY 0
              poner RICORA_GALLETA_SEGURA 0
              puerto=$(valor RICORA_PUERTO)
              if [ "$puerto" = "80" ]; then poner RICORA_URL_PUBLICA "http://$DROPLET_HOST"; else poner RICORA_URL_PUBLICA "http://$DROPLET_HOST:$puerto"; fi
            fi

            # Se retiran los contenedores de la versión anterior (Django,
            # trabajador, Redis, Ollama). Sus volúmenes de datos se conservan.
            docker compose up --build -d --remove-orphans
            docker image prune -f >/dev/null || true

            echo "== Estado de los contenedores =="
            docker compose ps
            echo "== Memoria =="
            free -m || true
            docker stats --no-stream --format "{{.Name}}: CPU {{.CPUPerc}} · memoria {{.MemUsage}}" || true
            echo "== Registro reciente de la aplicación =="
            docker compose logs --tail 40 web || true
            echo "== Registro del trabajador de ingesta =="
            docker compose logs --tail 20 trabajador || true
            echo "== Herramientas de ingesta en la imagen =="
            docker compose exec -T web sh -c 'sf -home /opt/siegfried -version | head -4; tesseract --list-langs 2>&1 | tail -n +2 | tr "\n" " "; echo; echo Ghostscript $(gs --version)' || true

            echo "== Esperando a que RICORA responda =="
            ok=0
            for i in $(seq 1 30); do
              codigo=$(timeout 15 docker compose exec -T web python -c "import urllib.request as u
            try:
                print(u.urlopen('http://127.0.0.1:8000/api/salud', timeout=10).status)
            except Exception as x:
                print(type(x).__name__)" 2>&1 | tail -1 || true)
              echo "  intento $i: $codigo"
              if [ "$codigo" = "200" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "RICORA no responde. Registro de la aplicación:"
              docker compose logs --tail 150 web
              exit 1
            fi

            if [ "$https" = 1 ]; then
              echo "== Comprobando HTTPS en https://$RICORA_DOMINIO =="
              segura=0
              for i in $(seq 1 24); do
                c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://$RICORA_DOMINIO/api/salud" || true)
                echo "  intento $i: $c"
                if [ "$c" = "200" ]; then segura=1; break; fi
                sleep 5
              done
              if [ "$segura" != 1 ]; then
                echo "  HTTPS no respondió: se vuelve a la dirección numérica. Registro de Caddy:"
                docker compose logs --tail 40 caddy || true
                docker compose rm -sf caddy || true
                quitar COMPOSE_PROFILES
                poner RICORA_PUERTO 80
                poner RICORA_WEB_BIND 0.0.0.0
                poner RICORA_DETRAS_DE_PROXY 0
                poner RICORA_GALLETA_SEGURA 0
                poner RICORA_URL_PUBLICA "http://$DROPLET_HOST"
                docker compose up -d --force-recreate web
              fi
            fi

            # Siempre: la cuenta administradora vuelve a quedar activa, con rol
            # administrador y la contraseña del secreto.
            docker compose exec -T web python -m app.cli cuenta-administradora || echo "  aviso: no se pudo configurar la cuenta administradora"
            echo "== Motor de análisis =="
            docker compose exec -T web python -m app.cli probar-motor || echo "  aviso: no se pudo probar el motor"
            docker compose exec -T web python -m app.cli probar-preservacion || echo "  aviso: la migración a PDF/A no funciona en el servidor"
