name: Desplegar en el Droplet

# Se dispara justo cuando llega un cambio a esta rama (no cada 5 minutos
# como el cron de respaldo en deploy-ricora.sh) — así lo que se trabaja
# aquí llega al servidor apenas se sube, sin esperar ni adivinar.
#
# Secretos opcionales que se escriben en el .env del servidor si existen
# (Settings → Secrets and variables → Actions):
#   GEMINI_API_KEY          clave de Gemini: al arrancar, RICORA registra y
#                           activa el proveedor si la conexión funciona
#   RICORA_ADMIN_USER       usuario superusuario a crear o restablecer
#   RICORA_ADMIN_PASSWORD   su contraseña (se restablece en cada despliegue)
on:
  push:
    branches: [claude/plataforma-base]
  workflow_dispatch: {}

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar y reconstruir en el Droplet
        uses: appleboy/ssh-action@v1
        # `envs` solo reenvía variables que existan en el runner: hay que
        # cargarlas desde los secretos aquí, o llegan vacías al servidor.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RICORA_ADMIN_USER: ${{ secrets.RICORA_ADMIN_USER }}
          RICORA_ADMIN_PASSWORD: ${{ secrets.RICORA_ADMIN_PASSWORD }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GEMINI_API_KEY,RICORA_ADMIN_USER,RICORA_ADMIN_PASSWORD,DROPLET_HOST
          command_timeout: 25m
          script: |
            set -e
            cd /root/ricora
            git fetch origin claude/plataforma-base
            git reset --hard origin/claude/plataforma-base

            # Memoria de reserva (swap) de 2 GB en el disco: con 2 GB de RAM y
            # el OCR en segundo plano, un lote grande pone el servidor lento
            # en vez de cerrar procesos a la fuerza. Se crea una sola vez.
            if ! swapon --show | grep -q "/swapfile"; then
              if [ ! -f /swapfile ]; then
                fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile || echo "  aviso: no se pudo crear /swapfile"
              fi
              swapon /swapfile && echo "  swap de 2 GB activo" || echo "  aviso: no se pudo activar el swap"
              grep -q "^/swapfile " /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab
            fi

            # Escribe en .env (sin mostrar valores) solo los secretos definidos.
            cambio=0
            poner() {  # poner CLAVE VALOR -> reemplaza o agrega la línea CLAVE=VALOR
              if [ -n "$2" ]; then
                if grep -qxF "$1=$2" .env; then
                  echo "  .env: $1 sin cambios"
                  return
                fi
                grep -v "^$1=" .env > .env.tmp || true
                mv .env.tmp .env
                echo "$1=$2" >> .env
                echo "  .env: $1 actualizado"
                cambio=1
              else
                echo "  .env: $1 no definido como secreto de GitHub; se deja como está"
              fi
            }
            poner GEMINI_API_KEY "$GEMINI_API_KEY"
            poner RICORA_ADMIN_USER "$RICORA_ADMIN_USER"
            poner RICORA_ADMIN_PASSWORD "$RICORA_ADMIN_PASSWORD"
            # El modelo antiguo dejó de estar disponible para claves nuevas.
            if grep -q "^MAZUCA_MODELO_IA_GEMINI=gemini-2.5-pro$" .env; then
              poner MAZUCA_MODELO_IA_GEMINI "gemini-3.5-flash"
            fi
            # La IP del servidor siempre debe estar entre los hosts permitidos.
            if ! grep "^DJANGO_ALLOWED_HOSTS=" .env | grep -q "$DROPLET_HOST"; then
              actual=$(grep "^DJANGO_ALLOWED_HOSTS=" .env | cut -d= -f2-)
              poner DJANGO_ALLOWED_HOSTS "${DROPLET_HOST},${actual:-localhost,127.0.0.1}"
            fi

            # Si cambió el .env, el contenedor debe recrearse para leerlo
            # (y volver a correr configurar_inicial al arrancar).
            if [ "$cambio" = 1 ]; then
              docker compose up --build -d --force-recreate web worker
            else
              docker compose up --build -d
            fi

            # Diagnóstico y verificación: primero el estado del servidor y el
            # registro de la web; luego el despliegue solo es exitoso si
            # RICORA responde.
            echo "== Estado de los contenedores =="
            docker compose ps
            echo "== Memoria =="
            free -m || true
            docker stats --no-stream --format "{{.Name}}: CPU {{.CPUPerc}} · memoria {{.MemUsage}}" || true
            echo "== Registro reciente de la web =="
            docker compose logs --tail 80 web || true
            echo "== Esperando a que RICORA responda =="
            ok=0
            for i in $(seq 1 24); do
              codigo=$(timeout 15 docker compose exec -T web python -c "import urllib.request as u, urllib.error as e
            r=u.Request('http://127.0.0.1:8000/ric/entrar/', headers={'Host': '$DROPLET_HOST'})
            try:
                print(u.urlopen(r, timeout=10).status)
            except e.HTTPError as x:
                print(x.code)
            except Exception as x:
                print(type(x).__name__)" 2>&1 | tail -1 || true)
              echo "  intento $i: $codigo"
              if [ "$codigo" = "200" ] || [ "$codigo" = "302" ]; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "RICORA no responde. Registro de la web:"
              docker compose logs --tail 150 web
              exit 1
            fi

            # Siempre, aunque el contenedor no se haya reiniciado: la cuenta de
            # RICORA_ADMIN_USER vuelve a ser administradora con la contraseña de
            # RICORA_ADMIN_PASSWORD. Es la vía para recuperar el acceso si esa
            # cuenta perdió el rol o la contraseña.
            docker compose exec -T -e RICORA_ADMIN_USER -e RICORA_ADMIN_PASSWORD web python manage.py configurar_inicial || echo "  aviso: la configuración inicial falló"
