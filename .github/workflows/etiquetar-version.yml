name: Etiquetar la versión evaluada

# La versión de RICORA con que se hizo una evaluación se identifica con una etiqueta del
# repositorio. Se corre a mano (Actions → «Etiquetar la versión evaluada» → Run
# workflow) con el commit que muestra RICORA en Resultados («versión congelada: sistema …»).
# No despliega nada: solo crea la etiqueta. Una etiqueta existente no se reemplaza.

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Nombre de la etiqueta (por ejemplo evaluacion-2026-11)"
        required: true
        default: "evaluacion-1"
      commit:
        description: "Commit evaluado (los 12 caracteres que muestra RICORA; vacío = el último de la rama)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Crear y publicar la etiqueta
        env:
          ETIQUETA: ${{ inputs.etiqueta }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          printf %s "$ETIQUETA" | grep -Eq '^[A-Za-z0-9._-]{1,60}$' || { echo "Nombre de etiqueta no válido."; exit 1; }
          if [ -n "$COMMIT" ]; then
            printf %s "$COMMIT" | grep -Eq '^[0-9a-f]{7,40}$' || { echo "Commit no válido."; exit 1; }
            OBJETIVO=$(git rev-parse --verify "$COMMIT^{commit}")
          else
            OBJETIVO=$(git rev-parse HEAD)
          fi
          if git rev-parse -q --verify "refs/tags/$ETIQUETA" >/dev/null; then
            echo "La etiqueta $ETIQUETA ya existe (apunta a $(git rev-list -n1 "$ETIQUETA")): no se reemplaza."
            exit 1
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -a "$ETIQUETA" "$OBJETIVO" -m "Versión de RICORA usada en la evaluación"
          git push origin "refs/tags/$ETIQUETA"
          echo "Etiqueta $ETIQUETA creada en el commit $OBJETIVO."
