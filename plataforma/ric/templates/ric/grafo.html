{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo de conocimiento · {{ entidad }} · MAZUCA</title>
<script src="{% static 'ric/js/cytoscape.min.js' %}"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; color: #1f2933; background: #fff; }
  header { padding: 12px 16px; border-bottom: 1px solid #e4e7eb; }
  header p.meta { color: #52606d; margin: 0 0 4px; font-size: .9rem; }
  header h1 { font-size: 1.2rem; margin: 0; }
  header a { font-size: .85rem; color: #1f3a5f; }
  #cy { width: 100%; height: calc(100vh - 70px); }
  .sin-datos { padding: 16px; color: #8a6100; font-style: italic; }
</style>
</head>
<body>
<header>
  <p class="meta"><strong>MAZUCA</strong> · Grafo de conocimiento (RiC) ·
    <a href="{% url 'ric_busqueda' %}">búsqueda</a> · <a href="{% url 'ric_sparql' %}">SPARQL</a></p>
  <h1>{{ entidad }}</h1>
  <a href="{% url 'ric_exportar_rdf' tipo entidad.pk %}">descargar como RDF (Turtle) ↗</a>
</header>
<div id="cy"></div>
<p id="sin-datos" class="sin-datos" style="display:none">Esta entidad todavía no tiene relaciones validadas.</p>
<script>
fetch("{% url 'ric_grafo_datos' tipo entidad.pk %}")
  .then(r => r.json())
  .then(datos => {
    if (datos.edges.length === 0) {
      document.getElementById("sin-datos").style.display = "block";
    }
    cytoscape({
      container: document.getElementById("cy"),
      elements: datos,
      style: [
        { selector: "node", style: {
            "label": "data(label)", "font-size": "11px", "text-valign": "center",
            "text-halign": "center", "text-wrap": "wrap", "text-max-width": "90px",
            "width": "70px", "height": "70px", "background-color": "#6b8cae", "color": "#fff",
        }},
        { selector: "node[?central]", style: { "background-color": "#1f3a5f", "width": "90px", "height": "90px" } },
        { selector: "edge", style: {
            "label": "data(label)", "font-size": "9px", "curve-style": "bezier",
            "target-arrow-shape": "triangle", "line-color": "#cbd2d9", "target-arrow-color": "#cbd2d9",
            "width": 2, "text-background-color": "#fff", "text-background-opacity": 1,
        }},
      ],
      layout: { name: "cose", animate: false },
    });
  });
</script>
</body>
</html>
