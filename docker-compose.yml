# RICORA con Docker Compose: base de datos PostgreSQL y la aplicación
# (API + interfaz). Una instancia por entidad, un .env por instancia.
#
# Uso local:
#   cp .env.example .env        # y complete los valores
#   docker compose up --build
#   abra http://localhost:8080
#
# La base de datos usa un volumen propio («bd»). Los volúmenes de la
# versión anterior de RICORA quedan intactos en el servidor: nada se
# borra de forma irreversible.

services:
  bd:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ricora
      POSTGRES_USER: ricora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ricora -d ricora"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ricora:${POSTGRES_PASSWORD}@bd:5432/ricora
      DIRECTORIO_ALMACENAMIENTO: /data/almacen
      RICORA_SEGUNDA_COPIA: ${RICORA_SEGUNDA_COPIA:-/data/segunda_copia}
      RICORA_RESPALDO: /data/respaldo
      RICORA_SEGUNDA_COPIA_SOLO_LECTURA: "1"
      RICORA_GRAFO_URL: http://grafo:7878
    # Con HTTPS (perfil «https») la aplicación solo escucha dentro del
    # servidor y Caddy la publica en los puertos 80 y 443.
    ports:
      - "${RICORA_WEB_BIND:-0.0.0.0}:${RICORA_PUERTO:-8080}:8000"
    volumes:
      - almacen:/data/almacen
      # Solo lectura: la web nunca escribe en la segunda copia (la crea el trabajador).
      - segunda_copia:/data/segunda_copia:ro
      - respaldo:/data/respaldo
    depends_on:
      bd:
        condition: service_healthy
      grafo:
        condition: service_healthy

  # Grafo RiC-O persistente: almacén de tripletas Oxigraph (SPARQL 1.1) con
  # un grafo por fondo. Es el único proceso que escribe en él; la web y el
  # trabajador lo usan por la red interna. No publica ningún puerto.
  grafo:
    build: .
    restart: unless-stopped
    command: ["grafo"]
    env_file:
      - .env
    environment:
      RICORA_GRAFO_DIRECTORIO: /data/grafo
    volumes:
      - grafo:/data/grafo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7878/salud', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Trabajador de ingesta: procesa lo cargado (huella, duplicados, formato
  # PRONOM, texto u OCR) en un proceso aparte de la web. Misma imagen y
  # mismo volumen de archivos; no publica ningún puerto.
  trabajador:
    build: .
    restart: unless-stopped
    command: ["trabajador"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ricora:${POSTGRES_PASSWORD}@bd:5432/ricora
      DIRECTORIO_ALMACENAMIENTO: /data/almacen
      RICORA_SEGUNDA_COPIA: ${RICORA_SEGUNDA_COPIA:-/data/segunda_copia}
      RICORA_RESPALDO: /data/respaldo
      RICORA_GRAFO_URL: http://grafo:7878
    volumes:
      - almacen:/data/almacen
      - segunda_copia:/data/segunda_copia
      - respaldo:/data/respaldo
    depends_on:
      bd:
        condition: service_healthy
      web:
        condition: service_started

  # HTTPS con certificado gratuito (Let's Encrypt) para RICORA_DOMINIO. Solo
  # se levanta con COMPOSE_PROFILES=https.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RICORA_DOMINIO: ${RICORA_DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  bd:
  almacen:
  # Segunda copia de cada archivo (preservación). Volumen distinto del
  # almacenamiento primario; en esta primera versión vive en el mismo disco
  # del servidor. Para una copia de verdad independiente, monte aquí otro
  # disco o un servidor de archivos (ver documentacion/modulo-5-preservacion.md).
  segunda_copia:
  # Respaldos de la base de datos (pg_dump) con su simulacro de restauración.
  # Mismo disco que la base: por eso el sistema exige además que el
  # administrador descargue el respaldo a otro equipo cada cierto tiempo.
  respaldo:
  # Grafo RiC-O persistente (almacén de tripletas Oxigraph). Se puede
  # rearmar entero desde la base: python -m app.cli sincronizar-grafo.
  grafo:
  caddy_data:
  caddy_config:
